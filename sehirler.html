<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>81 Sancak — 81 SANCAK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- RECODE NOTU: CSS yine tekrar ediyor (index/muharebe/ferman ile ayni). -->
<!-- En guzel recode: hepsini tek bir stil.css dosyasina tasi. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0b09;color:#e9e2d0;font-family:'Inter',sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 50% -10%, rgba(212,175,55,0.10), transparent 55%)}
a{color:inherit;text-decoration:none}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px;
  border-bottom:1px solid #2a2418;background:#0f0d0a;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo .kutu{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,#d4af37,#8a6d1c);
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 18px rgba(212,175,55,0.55)}
.logo b{font-family:'Cinzel',serif;font-size:20px;letter-spacing:1px}
.logo small{display:block;color:#9c9282;font-size:11px;letter-spacing:3px}
.nav-links{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.nav-links a{color:#c9bfa8;font-size:14px;font-weight:500;transition:.2s}
.nav-links a:hover{color:#f0d264;text-shadow:0 0 10px rgba(240,210,100,.6)}
.nav-links a.aktif{color:#f0d264}
.btn{cursor:pointer;border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;
  transition:.2s;font-family:'Inter',sans-serif}
.btn-altin{background:linear-gradient(145deg,#e6c65c,#b8901f);color:#1a1408;box-shadow:0 0 16px rgba(212,175,55,.4)}
.btn-altin:hover{box-shadow:0 0 26px rgba(212,175,55,.75);transform:translateY(-1px)}
.btn-hayalet{background:transparent;color:#e9e2d0;border:1px solid #3a3223}
.btn-hayalet:hover{border-color:#d4af37;color:#f0d264}

.ust-baslik{max-width:1180px;margin:34px auto 10px;padding:0 20px;text-align:center}
.ust-baslik h1{font-family:'Cinzel',serif;font-size:34px;margin-bottom:8px}
.ust-baslik p{color:#9c9282;font-size:15px}

/* arac cubugu */
.araclar{max-width:1180px;margin:22px auto;padding:0 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.araclar input{padding:11px 16px;border-radius:10px;border:1px solid #3a3223;background:#0a0908;
  color:#e9e2d0;font-size:14px;min-width:240px;font-family:'Inter',sans-serif}
.araclar input:focus{outline:none;border-color:#d4af37}
.filtreler{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{cursor:pointer;padding:7px 14px;border-radius:20px;font-size:13px;border:1px solid #2a2418;
  background:#161310;color:#c9bfa8;transition:.2s}
.chip:hover{border-color:#d4af37}
.chip.aktif{background:linear-gradient(145deg,#e6c65c,#b8901f);color:#1a1408;border-color:#d4af37}

/* izgara */
.izgara{max-width:1180px;margin:10px auto 60px;padding:0 20px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.il-kart{background:linear-gradient(160deg,#161310,#0f0d0a);border:1px solid #2f2819;border-radius:14px;
  padding:16px;transition:.2s;position:relative;overflow:hidden}
.il-kart:hover{border-color:#d4af37;box-shadow:0 0 22px rgba(212,175,55,.18);transform:translateY(-2px)}
.il-ust{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.plaka{background:#241d10;color:#e6c65c;border:1px solid #4a3d1d;border-radius:9px;
  padding:8px 10px;font-family:'Cinzel',serif;font-weight:700;font-size:18px;text-align:center;line-height:1;min-width:48px}
.plaka small{display:block;font-size:8px;letter-spacing:1px;color:#9c8b5f;margin-top:3px}
.il-ad{font-family:'Cinzel',serif;font-size:19px}
.bolge-etiket{display:inline-block;font-size:11px;padding:3px 9px;border-radius:12px;margin-top:3px;
  border:1px solid;background:rgba(255,255,255,.03)}
.il-alt{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid #221d13}
.biat-say{display:inline-flex;align-items:center;gap:5px;color:#ff8a5c;font-size:13px;font-weight:700}
.ilce-say{color:#9c9282;font-size:12px}
.bos-uyari{text-align:center;color:#9c9282;padding:40px;grid-column:1/-1}
footer{border-top:1px solid #221d13;text-align:center;padding:24px;color:#6b5f45;font-size:13px}
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html" class="logo">
    <div class="kutu">🗺</div>
    <div><b>81 SANCAK</b><small>81 SANCAK HARİTASI</small></div>
  </a>
  <div class="nav-links">
    <a href="index.html">Divan</a>
    <a href="muharebe.html">Meydan Muharebesi</a>
    <a href="sehirler.html" class="aktif">81 Sancak</a>
    <a href="meyhane.html">Meyhane Kur</a>
    <a href="ferman.html"><button class="btn btn-altin">⚑ Ferman Al</button></a>
  </div>
</div>

<div class="ust-baslik">
  <h1>81 Sancak Divanı</h1>
  <p>Türkiye'nin tüm illeri sancak olarak burada. Sancağını bul, biat et, meyhaneni kur.</p>
</div>

<div class="araclar">
  <input type="text" id="arama" placeholder="🔍 Sancak ara (örn: Trabzon)..." oninput="ciz()">
</div>
<div class="araclar">
  <div class="filtreler" id="filtreler"></div>
</div>

<div class="izgara" id="izgara"></div>

<footer><b>81 SANCAK</b> — 81 Sancak · Biat sayıları offline modda tarayıcında (localStorage) tutulur.</footer>

<script src="iller.js"></script>
<script>
// aktif bolge filtresi
var aktifBolge = "Hepsi";

// biat sayilari (localStorage'da tutulur, yoksa plakaya gore sahte deger)
function biatlariGetir(){
  var k = localStorage.getItem('ilBiat');
  return k ? JSON.parse(k) : {};
}
function biatlariKaydet(o){ localStorage.setItem('ilBiat', JSON.stringify(o)); }

function ilinBiati(plaka){
  var b = biatlariGetir();
  if(b[plaka] === undefined){
    // RECODE: baslangicta sahte/rastgele deger uretiyoruz. Gercek veriyle degistir!
    b[plaka] = (plaka * 3) % 40 + 1;
    biatlariKaydet(b);
  }
  return b[plaka];
}

function biatEt(plaka){
  var b = biatlariGetir();
  b[plaka] = (b[plaka] || 0) + 1;
  biatlariKaydet(b);
  ciz();
}

// filtre chip'lerini olustur
function filtreleriKur(){
  var bolgeler = ["Hepsi","Marmara","Ege","Akdeniz","İç Anadolu","Karadeniz","Doğu Anadolu","Güneydoğu Anadolu"];
  var f = document.getElementById('filtreler');
  f.innerHTML = '';
  bolgeler.forEach(function(b){
    var c = document.createElement('div');
    c.className = 'chip' + (b===aktifBolge ? ' aktif' : '');
    c.textContent = b;
    c.onclick = function(){ aktifBolge = b; filtreleriKur(); ciz(); };
    f.appendChild(c);
  });
}

// izgarayi ciz
function ciz(){
  var arama = document.getElementById('arama').value.toLowerCase();
  var g = document.getElementById('izgara');
  g.innerHTML = '';

  var gosterilen = 0;
  ILLER.forEach(function(il){
    // filtre kontrolu
    if(aktifBolge !== "Hepsi" && il.bolge !== aktifBolge) return;
    if(arama && il.ad.toLowerCase().indexOf(arama) === -1) return;
    gosterilen++;

    var renk = BOLGE_RENK[il.bolge] || "#d4af37";
    var kart = document.createElement('div');
    kart.className = 'il-kart';
    kart.innerHTML =
      '<div class="il-ust">' +
        '<div class="plaka">' + (il.plaka<10 ? '0'+il.plaka : il.plaka) + '<small>SANCAK</small></div>' +
        '<div>' +
          '<div class="il-ad">' + il.ad + '</div>' +
          '<span class="bolge-etiket" style="color:'+renk+';border-color:'+renk+'">' + il.bolge + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="il-alt">' +
        '<span class="biat-say">🔥 ' + ilinBiati(il.plaka) + ' biat</span>' +
        '<span class="ilce-say">' + il.ilceler.length + ' ilçe</span>' +
      '</div>' +
      '<button class="btn btn-altin" style="width:100%;margin-top:12px;padding:9px" onclick="biatEt('+il.plaka+')">🔥 Bu Sancağa Biat Et</button>';
    g.appendChild(kart);
  });

  if(gosterilen === 0){
    g.innerHTML = '<div class="bos-uyari">Bu kritere uyan sancak bulunamadı. 😔</div>';
  }
}

filtreleriKur();
ciz();
</script>
</body>
</html>
